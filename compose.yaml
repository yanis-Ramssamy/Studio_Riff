services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copiez .env.example vers .env}
      POSTGRES_DB: ${POSTGRES_DB:-studio_riff}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8.1
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
